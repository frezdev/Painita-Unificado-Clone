<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Existoso</title>
</head>
<style>
  :root { --primary:#B00020; --white:#fff; --black:#000; --topbar-h: 64px; }
  * {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  }
  #root {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
    justify-content: center;
    align-items: center;
    text-align: center;

    & .check {
      height: 48px;
      display: grid;
      width: 48px;
      font-size: 24px;
      background: #00b000;
      place-items: center;
      color: #fff;
      border-radius: 50%;
    }

    & h3 {
      font-size: 34px;
      color: var(--primary)
    }

    & p {
      color: gray;
      margin-top: 8px;
    }
  }
</style>
<body>
  <div id="root">
    <span class="check">✔</span>
    <h3>Pago Realizado</h3>
    <p>Puedes cerrar esta ventana.</p>
  </div>
</body>
</html>
